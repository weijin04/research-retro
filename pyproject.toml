[project]
name = "research-retro"
version = "3.6.0"
description = "Host-led scientific reconstruction, revision and portable research handoff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
retro = "research_harness.cli:main"
rh = "research_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_harness"]

[tool.hatch.build.targets.sdist]
include = ["src/research_harness", "pyproject.toml", "README.md", "AGENT.md"]
