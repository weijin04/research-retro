[project]
name = "research-harness"
version = "0.2.0"
description = "Evidence bounded scientific reconstruction and controlled research"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
rh = "research_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_harness"]
